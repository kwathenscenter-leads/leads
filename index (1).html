<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Στοιχεία πελάτη</title>
<style>
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #7a8190;
    --code: #e91e63;
    --link: #1a73e8;
    --call: #1e8e3e;
    --ok: #e6f4ea;
    --warn: #fff3cd;
    --err: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 16px 32px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .head { margin: 4px 2px 16px; }
  .code { font-size: 30px; font-weight: 700; color: var(--code); letter-spacing: .5px; }
  .src { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 18px;
    margin-bottom: 16px; box-shadow: 0 1px 2px rgba(31,36,48,.08);
  }
  .lbl { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .lbl:first-child { margin-top: 0; }
  .val { font-size: 18px; margin-top: 2px; word-break: break-word; }
  .val a { color: var(--link); text-decoration: none; }
  .msg { font-style: italic; color: #444; margin-top: 4px; line-height: 1.5; white-space: pre-wrap; }
  .call {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 64px; border-radius: 14px;
    background: var(--call); color: #fff; text-decoration: none;
    font-size: 21px; font-weight: 700;
    box-shadow: 0 3px 0 #146c2e;
  }
  .call:active { transform: translateY(2px); box-shadow: 0 1px 0 #146c2e; }
  .call:focus-visible { outline: 3px solid #1a73e8; outline-offset: 3px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 16px; }
  .retry {
    display: block; width: 100%; margin-top: 10px; padding: 14px;
    border: 0; border-radius: 10px; background: var(--link); color: #fff;
    font-size: 16px; font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><p class="loading">Φόρτωση στοιχείων…</p></div>
</div>

<script>
// ⚠️ Το /exec URL του Apps Script. ΔΕΝ αλλάζει όσο κάνεις «Νέα έκδοση» στην ίδια ανάπτυξη.
var EXEC = "https://script.google.com/macros/s/AKfycbxKbMew1T1Wg_oyVeb2q8D9diPv_Oc9qMsm9yDfUdAyWvi99uL3erd0GqXmzOjz_I6dOg/exec";

(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get("id") || "";
  var r = q.get("r") || "";
  var app = document.getElementById("app");
  var pressed = false;
  var confirmed = false;
  var checks = 0;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function telHref(p) { return String(p || "").replace(/[^\d+]/g, ""); }

  function fail(text) {
    app.innerHTML =
      '<div class="card"><p style="margin:0;font-size:17px;">' + esc(text) + '</p>' +
      '<button class="retry" type="button" onclick="location.reload()">Ξαναδοκίμασε</button></div>';
  }

  function getLead(cb) {
    var url = EXEC + "?api=lead&id=" + encodeURIComponent(id) + "&r=" + encodeURIComponent(r) +
              "&t=" + Date.now();
    fetch(url, { method: "GET", redirect: "follow", cache: "no-store" })
      .then(function (res) { return res.json(); })
      .then(cb)
      .catch(function () { cb({ ok: false, msg: "Δεν ήταν δυνατή η σύνδεση. Έλεγξε το internet και ξαναδοκίμασε." }); });
  }

  function sendCall() {
    var params = "action=call&id=" + encodeURIComponent(id) + "&r=" + encodeURIComponent(r);
    var url = EXEC + "?" + params;
    var queued = false;
    try {
      if (navigator.sendBeacon) {
        queued = navigator.sendBeacon(url, new Blob([params], { type: "application/x-www-form-urlencoded" }));
      }
    } catch (e) {}
    if (!queued) {
      try {
        fetch(url, {
          method: "POST", mode: "no-cors", keepalive: true,
          headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: params
        });
      } catch (e) {}
    }
  }

  // Αθόρυβος έλεγχος: αν δεν καταγράφηκε, ξαναστέλνει (έως 3 φορές).
  function verify() {
    if (!pressed || confirmed) return;
    getLead(function (d) {
      if (d && d.ok && d.called) { confirmed = true; return; }
      checks++;
      if (checks <= 3) { sendCall(); setTimeout(verify, 3000); }
    });
  }

  function render(d) {
    var phone = String(d.phone || "");
    var mail = String(d.email || "");
    var html =
      '<div class="head"><div class="code">#' + esc(d.code) + '</div>' +
        '<div class="src">' + esc(d.source) + '</div></div>' +
      '<div class="card">' +
        '<div class="lbl">Πελάτης</div><div class="val">' + (esc(d.name) || "—") + '</div>' +
        (phone ? '<div class="lbl">Τηλέφωνο</div><div class="val">' + esc(phone) + '</div>' : '') +
        (mail ? '<div class="lbl">Email</div><div class="val"><a href="mailto:' + esc(mail) + '">' + esc(mail) + '</a></div>' : '') +
        (d.message ? '<div class="lbl">Μήνυμα</div><div class="msg">«' + esc(d.message) + '»</div>' : '') +
      '</div>';

    if (phone) {
      html += '<a class="call" id="callBtn" href="tel:' + telHref(phone) + '">📞 Κλήση</a>';
    } else {
      html += '<div class="card" style="text-align:center;color:#7a8190;">Δεν υπάρχει τηλέφωνο πελάτη.</div>';
    }
    app.innerHTML = html;

    if (d.called) confirmed = true;

    var btn = document.getElementById("callBtn");
    if (btn) {
      btn.addEventListener("click", function () {
        if (confirmed) return;
        pressed = true;
        checks = 0;
        sendCall();
        setTimeout(verify, 3500);
      });
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") setTimeout(verify, 500);
  });

  if (!id) { fail("Ο σύνδεσμος δεν είναι έγκυρος."); return; }
  getLead(function (d) {
    if (!d || !d.ok) { fail((d && d.msg) || "Η κλήση δεν βρέθηκε."); return; }
    render(d);
  });
})();
</script>
</body>
</html>
